<!doctype html>
<html lang="en">
  <head>
    <title></title>
    <link rel="stylesheet" href="./styles/styles.css" />
    <link rel="icon" href="/2026-fall-mx/favicon.png" />
    <meta name="color-scheme" content="light dark">

  </head>
  <body>
    <header class="header">
      <div class="center line">
        <div class="big line">
          <img src="/2026-fall-mx/images/logo-5in.png" alt="5in" width="80" />
          <b>5IN</b>
        </div>
        <menu class="line">
          <a href="/2026-fall-mx/students/lalisa/">Home</a>
        </menu>
      </div>
    </header>
    <main class="center">
      <h1>Homepage of Lisa</h1>

      <fieldset>
        <legend>Color scheme</legend>
        <label>
          <input type="radio" name="color-scheme-choice" value="light" />
          Light
        </label>
        <label>
          <input
            type="radio"
            name="color-scheme-choice"
            value="light dark"
            checked
          />
          Auto
        </label>
        <label>
          <input type="radio" name="color-scheme-choice" value="dark" />
          Dark
        </label>
      </fieldset>
    </main>
    <footer class="footer">
      <div class="center">
        <p>Last updated: 2026 September 14</p>
        <p>
          Code:
          <a href="https://github.com/5in-tw/2026-fall-mixed">GitHub</a>
        </p>
      </div>
    </footer>

    <script src="./scripts/color-scheme.js" type="module"></script>

  </body>
</html>
